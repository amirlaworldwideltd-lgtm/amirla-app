<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<meta name="theme-color" content="#0E0A05"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="AMIRLA"/>
<meta name="application-name" content="AMIRLA"/>
<meta name="description" content="AMIRLA - Agricultural Management & Intelligence for Rural Livestock Applications. Professional farm management for Nigerian livestock farmers."/>
<meta name="msapplication-TileColor" content="#0E0A05"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icons/icon-192.png"/>
<title>AMIRLA — Farm Management</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Outfit:wght@300;400;500;600;700&display=swap');

/* ═══ RESET & ROOT ═══ */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;}
:root{
  --soil:#0E0A05;--earth:#1A1208;--bark:#261B0C;--clay:#3D2B14;
  --humus:#4E3820;--card:#1E1509;--div:#3A2A10;
  --glow:#4AFF91;--leaf:#2ECC71;--sage:#27AE60;--deep:#1A6B3C;
  --ember:#E67E22;--sun:#F39C12;--dusk:#D35400;
  --sky:#5DADE2;--water:#2E86AB;
  --danger:#E74C3C;--rose:#FF6B6B;
  --cream:#F5F0E8;--parch:#E8DCC8;--gold:#D4AF37;
  --mist:#8A9BA8;--fog:#5A6A74;--smoke:#3A4A54;
  --h1:'Playfair Display',serif;--body:'Outfit',sans-serif;
}
html,body{
  height:100%;width:100%;
  background:var(--soil);
  font-family:var(--body);
  color:var(--cream);
  overflow:hidden;
  position:fixed;
  /* Safe area for notched phones */
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
}

/* ═══ SCROLLBAR ═══ */
::-webkit-scrollbar{width:2px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--clay);border-radius:1px;}

/* ═══ ANIMATIONS ═══ */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(50px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes ping{0%{transform:scale(1);opacity:.8}100%{transform:scale(2.2);opacity:0}}
@keyframes glowPulse{0%,100%{box-shadow:0 0 0 0 #4AFF9100}50%{box-shadow:0 0 18px 4px #4AFF9133}}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes barFill{from{width:0}to{width:var(--w)}}

.fu{animation:fadeUp .38s cubic-bezier(.16,1,.3,1) both}
.fi{animation:fadeIn .25s ease both}
.su{animation:slideUp .4s cubic-bezier(.16,1,.3,1) both}

/* ═══ LAYOUT ═══ */
#app{
  display:flex;flex-direction:column;
  height:100%;width:100%;
  max-width:430px;margin:0 auto;
  background:var(--soil);
  position:relative;
  box-shadow:0 0 60px #000a;
}

/* ═══ STATUS BAR ═══ */
#statusbar{
  background:var(--earth);
  padding:8px 20px 6px;
  display:flex;justify-content:space-between;align-items:center;
  flex-shrink:0;font-size:12px;font-weight:700;color:var(--cream);
}
.sb-island{
  width:80px;height:20px;background:var(--soil);
  border-radius:10px;display:flex;align-items:center;justify-content:center;gap:6px;
}
.sb-cam{width:7px;height:7px;border-radius:50%;background:var(--bark);}
.sb-mic{width:30px;height:5px;border-radius:3px;background:var(--bark);}

/* ═══ TOPBAR ═══ */
#topbar{
  background:var(--earth);
  padding:8px 16px 12px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--div);
  flex-shrink:0;
}
.logo-wrap{display:flex;align-items:center;gap:10px;cursor:pointer;}
.logo-icon{
  width:36px;height:36px;border-radius:12px;
  background:linear-gradient(135deg,var(--deep),var(--sage));
  display:flex;align-items:center;justify-content:center;font-size:20px;
  box-shadow:0 4px 14px #2ECC7155;
}
.logo-text-main{font-family:var(--h1);font-size:19px;font-weight:900;color:var(--cream);line-height:1;}
.logo-text-sub{font-size:8px;color:var(--fog);letter-spacing:2px;text-transform:uppercase;}
.topbar-icons{display:flex;gap:8px;}
.icon-btn{
  width:34px;height:34px;border-radius:10px;
  background:var(--bark);border:1px solid var(--div);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:all .2s;position:relative;
}
.icon-btn:active{transform:scale(.92);}
.badge-dot{
  position:absolute;top:-4px;right:-4px;
  background:var(--danger);color:white;
  width:16px;height:16px;border-radius:50%;
  font-size:9px;font-weight:800;
  display:flex;align-items:center;justify-content:center;
}

/* ═══ SECONDARY NAV STRIP ═══ */
#secnav{
  background:var(--earth);
  padding:8px 12px;
  display:flex;gap:8px;overflow-x:auto;
  border-bottom:1px solid var(--div);
  flex-shrink:0;
  scroll-behavior:smooth;
}
#secnav::-webkit-scrollbar{display:none;}
.secnav-btn{
  display:flex;align-items:center;gap:5px;
  padding:6px 12px;border-radius:20px;
  border:1.5px solid var(--clay);background:var(--card);
  color:var(--fog);font-size:12px;font-weight:700;
  cursor:pointer;white-space:nowrap;font-family:var(--body);
  transition:all .2s;flex-shrink:0;
}
.secnav-btn.active{border-color:var(--leaf);background:#2ECC7122;color:var(--leaf);}

/* ═══ CONTENT ═══ */
#content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 14px 8px;}

/* ═══ BOTTOM NAV ═══ */
#bottomnav{
  background:var(--earth);
  border-top:1px solid var(--div);
  padding:10px 4px calc(10px + env(safe-area-inset-bottom));
  display:flex;justify-content:space-around;
  flex-shrink:0;
}
.nav-btn{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:6px 10px;border-radius:16px;border:none;
  background:transparent;cursor:pointer;transition:all .2s;
  position:relative;min-width:54px;
}
.nav-btn.active{background:#2ECC7118;}
.nav-btn span{font-size:10px;font-weight:700;color:var(--fog);letter-spacing:.2px;font-family:var(--body);}
.nav-btn.active span{color:var(--leaf);}
.nav-indicator{width:20px;height:3px;border-radius:2px;background:var(--leaf);box-shadow:0 0 8px var(--glow);margin-top:1px;}
.nav-badge{
  position:absolute;top:2px;right:4px;
  background:var(--danger);color:#fff;
  width:14px;height:14px;border-radius:50%;
  font-size:9px;font-weight:800;
  display:flex;align-items:center;justify-content:center;
}

/* ═══ CARDS ═══ */
.card{
  background:var(--card);border:1px solid var(--div);
  border-radius:18px;padding:15px;
  transition:all .22s;margin-bottom:10px;
}
.card.tap{cursor:pointer;}
.card.tap:active{transform:scale(.98);border-color:#2ECC7144;}

/* ═══ HERO CARD ═══ */
.hero{
  background:linear-gradient(135deg,#1A6B3Ccc 0%,var(--bark) 100%);
  border:1px solid #2ECC7133;border-radius:22px;
  padding:20px;margin-bottom:18px;position:relative;overflow:hidden;
}
.hero::before{
  content:'';position:absolute;right:-30px;top:-30px;
  width:130px;height:130px;border-radius:50%;
  background:#4AFF9108;
}
.hero::after{
  content:'';position:absolute;right:20px;bottom:-40px;
  width:100px;height:100px;border-radius:50%;
  background:#2ECC7108;
}

/* ═══ STAT GRID ═══ */
.stat-row{display:flex;gap:10px;margin-bottom:10px;}
.stat-card{
  flex:1;background:var(--card);border:1px solid var(--div);
  border-radius:18px;padding:14px;cursor:pointer;transition:all .22s;
}
.stat-card:active{transform:scale(.97);}
.stat-icon{
  width:34px;height:34px;border-radius:10px;
  display:flex;align-items:center;justify-content:center;margin-bottom:10px;
}
.stat-label{font-size:10px;color:var(--fog);font-weight:600;text-transform:uppercase;letter-spacing:.8px;}
.stat-value{font-family:var(--h1);font-size:24px;font-weight:700;color:var(--cream);margin-top:4px;}
.stat-sub{font-size:11px;color:var(--fog);margin-top:3px;}

/* ═══ PROGRESS BAR ═══ */
.bar-track{background:var(--smoke);border-radius:10px;overflow:hidden;}
.bar-fill{
  height:100%;border-radius:10px;
  transition:width .7s cubic-bezier(.4,0,.2,1);
  box-shadow:0 0 8px currentColor;
}

/* ═══ BADGE ═══ */
.badge{
  display:inline-flex;align-items:center;
  border-radius:20px;padding:2px 9px;
  font-size:11px;font-weight:600;letter-spacing:.2px;
  flex-shrink:0;
}

/* ═══ STATUS DOT ═══ */
.dot-wrap{position:relative;width:10px;height:10px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
.dot-ring{position:absolute;inset:0;border-radius:50%;animation:ping 1.5s ease-out infinite;}
.dot-core{width:8px;height:8px;border-radius:50%;display:block;}

/* ═══ SECTION HEADER ═══ */
.sh{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;}
.sh h2{font-family:var(--h1);font-size:20px;font-weight:700;color:var(--cream);line-height:1.2;}
.sh p{font-size:12px;color:var(--fog);margin-top:3px;}
.sh-add{
  display:flex;align-items:center;gap:5px;
  padding:7px 12px;border-radius:11px;
  border:1.5px solid var(--leaf);background:#2ECC7122;
  color:var(--leaf);font-size:12px;font-weight:700;cursor:pointer;
  font-family:var(--body);transition:all .15s;white-space:nowrap;
}
.sh-add:active{transform:scale(.95);}

/* ═══ BUTTON ═══ */
.btn{
  display:flex;align-items:center;justify-content:center;gap:7px;
  border-radius:12px;font-weight:700;cursor:pointer;
  font-family:var(--body);letter-spacing:.3px;transition:all .15s;
  border:none;
}
.btn:active{transform:scale(.96);}
.btn-primary{
  background:linear-gradient(135deg,var(--leaf),var(--sage));
  color:var(--soil);padding:13px 20px;font-size:14px;width:100%;
  box-shadow:0 4px 16px #2ECC7144;
}
.btn-sm{padding:7px 14px;font-size:12px;}
.btn-outline{background:transparent;border:1.5px solid var(--leaf);color:var(--leaf);}

/* ═══ FORM FIELDS ═══ */
.field{margin-bottom:14px;}
.field label{font-size:11px;color:var(--mist);display:block;margin-bottom:6px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;}
.field input,.field select,.field textarea{
  width:100%;background:var(--bark);border:1px solid var(--clay);
  border-radius:12px;padding:11px 14px;color:var(--cream);
  font-size:14px;font-family:var(--body);outline:none;
  transition:border-color .2s,box-shadow .2s;
}
.field input:focus,.field select:focus{border-color:var(--leaf);box-shadow:0 0 0 3px #2ECC7122;}
.field input::placeholder{color:var(--fog);}
.field select option{background:var(--bark);}

/* ═══ BOTTOM SHEET ═══ */
.sheet-overlay{
  position:fixed;inset:0;background:#00000090;
  z-index:900;display:flex;align-items:flex-end;justify-content:center;
  animation:fadeIn .2s ease;
}
.sheet{
  background:var(--bark);border-radius:24px 24px 0 0;
  width:100%;max-width:430px;max-height:88vh;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:0 18px calc(20px + env(safe-area-inset-bottom));
  animation:slideUp .35s cubic-bezier(.16,1,.3,1);
}
.sheet-handle{width:40px;height:4px;background:var(--clay);border-radius:2px;margin:12px auto 18px;}
.sheet-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.sheet-title{font-family:var(--h1);font-size:19px;font-weight:700;color:var(--cream);}
.sheet-close{
  background:var(--clay);border:none;color:var(--mist);
  border-radius:8px;width:30px;height:30px;cursor:pointer;
  font-size:16px;display:flex;align-items:center;justify-content:center;
}

/* ═══ QUICK ACTIONS GRID ═══ */
.qa-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px;}
.qa-item{
  background:var(--card);border:1px solid var(--div);
  border-radius:15px;padding:14px 8px;text-align:center;cursor:pointer;
  transition:all .2s;
}
.qa-item:active{transform:scale(.94);}
.qa-icon-wrap{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;margin:0 auto 8px;}
.qa-label{font-size:11px;color:var(--cream);font-weight:600;line-height:1.3;}

/* ═══ TASK ITEM ═══ */
.task-item{
  display:flex;align-items:center;gap:12px;
  padding:11px 13px;border-radius:13px;
  border:1px solid var(--div);background:var(--card);
  transition:all .2s;margin-bottom:8px;cursor:pointer;
}
.task-item.done{background:#2ECC7112;border-color:#2ECC7144;opacity:.75;}
.task-check{
  width:22px;height:22px;border-radius:7px;flex-shrink:0;
  border:2px solid var(--clay);background:var(--smoke);
  display:flex;align-items:center;justify-content:center;transition:all .2s;
}
.task-check.done{background:var(--leaf);border-color:var(--leaf);}
.task-text{font-size:13px;font-weight:500;color:var(--cream);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.task-item.done .task-text{text-decoration:line-through;color:var(--fog);}
.task-meta{font-size:11px;color:var(--fog);margin-top:2px;}
.pri-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}

/* ═══ TRANSACTION ITEM ═══ */
.tx-item{display:flex;align-items:center;gap:12px;padding:13px;border-radius:15px;background:var(--card);border:1px solid var(--div);margin-bottom:8px;}
.tx-icon{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.tx-cat{font-size:13px;font-weight:700;color:var(--cream);}
.tx-meta{font-size:11px;color:var(--mist);}
.tx-sub{font-size:10px;color:var(--fog);margin-top:1px;}
.tx-amt{font-family:var(--h1);font-size:15px;font-weight:700;flex-shrink:0;margin-left:8px;}

/* ═══ TOGGLE SWITCH ═══ */
.toggle-wrap{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--div);}
.toggle-track{width:44px;height:24px;border-radius:12px;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0;}
.toggle-thumb{width:20px;height:20px;border-radius:50%;background:var(--cream);position:absolute;top:2px;transition:left .2s;box-shadow:0 1px 4px #00000060;}

/* ═══ FILTER CHIPS ═══ */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;}
.chips::-webkit-scrollbar{display:none;}
.chip{
  padding:6px 13px;border-radius:20px;font-size:12px;font-weight:600;
  border:1.5px solid var(--clay);background:var(--card);color:var(--fog);
  cursor:pointer;white-space:nowrap;font-family:var(--body);transition:all .2s;flex-shrink:0;
}
.chip.active{border-color:var(--leaf);background:#2ECC7122;color:var(--leaf);}

/* ═══ ANIMAL CARD ═══ */
.animal-card{
  display:flex;align-items:center;gap:13px;
  padding:13px;border-radius:16px;background:var(--card);
  border:1px solid var(--div);margin-bottom:9px;cursor:pointer;transition:all .2s;
}
.animal-card:active{transform:scale(.98);}
.animal-avatar{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:24px;}
.animal-id{font-family:var(--h1);font-size:16px;font-weight:700;color:var(--cream);}
.animal-breed{font-size:12px;color:var(--mist);margin-top:2px;}
.animal-loc{font-size:11px;color:var(--fog);margin-top:2px;}

/* ═══ VACCINE CARD ═══ */
.vax-card{padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--div);margin-bottom:10px;}
.vax-header{display:flex;gap:12px;align-items:flex-start;}
.vax-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.vax-name{font-family:var(--h1);font-size:15px;font-weight:700;color:var(--cream);margin-bottom:3px;}
.vax-sp{font-size:12px;color:var(--mist);}
.vax-dates{display:flex;gap:14px;font-size:12px;margin-top:6px;}

/* ═══ PRICE ROW ═══ */
.price-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--div);}
.price-item{font-size:12px;color:var(--cream);}
.price-val{font-size:12px;font-weight:700;}

/* ═══ INSTALL BANNER ═══ */
#install-banner{
  position:fixed;bottom:0;left:0;right:0;
  background:linear-gradient(135deg,var(--deep),var(--bark));
  border-top:1px solid var(--leaf);
  padding:14px 16px calc(14px + env(safe-area-inset-bottom));
  z-index:9999;
  display:flex;align-items:center;gap:12px;
  box-shadow:0 -8px 40px #000a;
}
#install-banner.hidden{display:none;}
.install-icon{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--deep),var(--sage));display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
.install-text{flex:1;}
.install-title{font-weight:700;color:var(--cream);font-size:14px;}
.install-sub{font-size:11px;color:var(--mist);margin-top:2px;}
#install-btn{
  background:linear-gradient(135deg,var(--leaf),var(--sage));
  color:var(--soil);border:none;border-radius:10px;
  padding:10px 16px;font-size:13px;font-weight:800;
  cursor:pointer;font-family:var(--body);white-space:nowrap;
  box-shadow:0 4px 14px #2ECC7144;flex-shrink:0;
}
#install-close{background:none;border:none;color:var(--fog);font-size:18px;cursor:pointer;flex-shrink:0;padding:4px;}

/* ═══ LOADING SPLASH ═══ */
#splash{
  position:fixed;inset:0;background:var(--soil);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:99999;transition:opacity .5s ease;
}
#splash.gone{opacity:0;pointer-events:none;}
.splash-logo{font-size:64px;margin-bottom:16px;animation:glowPulse 2s ease-in-out infinite;}
.splash-name{font-family:var(--h1);font-size:38px;font-weight:900;color:var(--glow);letter-spacing:-2px;}
.splash-tagline{font-size:12px;color:var(--fog);letter-spacing:2px;text-transform:uppercase;margin-top:8px;}
.splash-bar{width:120px;height:3px;background:var(--smoke);border-radius:2px;margin-top:40px;overflow:hidden;}
.splash-progress{height:100%;background:var(--leaf);border-radius:2px;animation:barFill 2s ease forwards;--w:100%;}

/* ═══ EMPTY STATE ═══ */
.empty{text-align:center;padding:40px 20px;color:var(--fog);}
.empty-icon{font-size:40px;margin-bottom:12px;}
.empty-text{font-size:14px;}

/* ═══ OFFLINE TOAST ═══ */
#offline-toast{
  position:fixed;top:80px;left:50%;transform:translateX(-50%);
  background:var(--ember);color:var(--soil);
  padding:10px 20px;border-radius:20px;font-size:13px;font-weight:700;
  z-index:8888;opacity:0;transition:opacity .3s;pointer-events:none;
  font-family:var(--body);
}
#offline-toast.show{opacity:1;}
</style>
</head>
<body>

<!-- SPLASH SCREEN -->
<div id="splash">
  <div class="splash-logo">🌿</div>
  <div class="splash-name">AMIRLA</div>
  <div class="splash-tagline">Farm Management System</div>
  <div class="splash-bar"><div class="splash-progress"></div></div>
</div>

<!-- INSTALL BANNER -->
<div id="install-banner" class="hidden">
  <div class="install-icon">🌿</div>
  <div class="install-text">
    <div class="install-title">Install AMIRLA</div>
    <div class="install-sub">Add to home screen — works offline</div>
  </div>
  <button id="install-btn">📲 Install</button>
  <button id="install-close">✕</button>
</div>

<!-- OFFLINE TOAST -->
<div id="offline-toast">📡 Offline — Data saved locally</div>

<!-- MAIN APP -->
<div id="app">
  <!-- STATUS BAR -->
  <div id="statusbar">
    <span id="sb-time">9:41</span>
    <div class="sb-island">
      <div class="sb-cam"></div>
      <div class="sb-mic"></div>
    </div>
    <span>●●● WiFi 🔋</span>
  </div>

  <!-- TOP BAR -->

/* ── PERSISTENCE ── */
function saveData(d){try{localStorage.setItem('amirla_data',JSON.stringify(d));}catch(e){}}
function loadData(){try{const s=localStorage.getItem('amirla_data');return s?JSON.parse(s):DEFAULT_DATA;}catch(e){return DEFAULT_DATA;}}

let DB = loadData();
function save(){saveData(DB);}

/* ── HELPERS ── */
const fmt   = n=>`₦${Number(n).toLocaleString()}`;
const pct   = (a,b)=>b>0?Math.round(a/b*100):0;
const esc   = s=>(s||"").replace(/</g,"&lt;");
const sCol  = s=>s==="Healthy"?"#2ECC71":s==="Sick"?"#E74C3C":s==="Pregnant"?"#5DADE2":s==="Lactating"?"#D4AF37":"#8A9BA8";
const vCol  = s=>s==="Overdue"?"#E74C3C":s==="Upcoming"?"#F39C12":s==="Completed"?"#2ECC71":"#5DADE2";
const txCol = t=>t==="Sale"?"#2ECC71":"#E74C3C";

let currentScreen="home";
let moreOpen=false;

/* ── NAVIGATION ── */
function navTo(screen){
  currentScreen=screen;
  moreOpen=false;
  renderScreen();
  updateNav();
  document.getElementById('content').scrollTop=0;
}
function goHome(){navTo('home');}

const PRIMARY=['home','animals','health','feeding','finance'];
const SECONDARY=['market','vaccines','tasks','staff','reports','settings'];

function updateNav(){
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  const navEl=document.getElementById('nav-'+currentScreen);
  if(navEl) navEl.classList.add('active');
  if(SECONDARY.includes(currentScreen)){
    document.getElementById('nav-more').classList.add('active');
  }

  // secondary nav
  const sn=document.getElementById('secnav');
  if(SECONDARY.includes(currentScreen)){
    sn.style.display='flex';
    document.querySelectorAll('.secnav-btn').forEach(b=>{
      b.classList.toggle('active',b.dataset.screen===currentScreen);
    });
  } else {
    sn.style.display='none';
  }

  // alert badge
  const sick=DB.animals.filter(a=>a.status==="Sick").length;
  const overdue=DB.vaccines.filter(v=>v.status==="Overdue").length;
  const alertBtn=document.getElementById('alert-btn');
  if(sick+overdue>0){
    alertBtn.style.display='flex';
    document.getElementById('alert-badge').textContent=sick+overdue;
  } else {
    alertBtn.style.display='none';
  }
}

function toggleMore(){
  moreOpen=!moreOpen;
  if(moreOpen && !SECONDARY.includes(currentScreen)) navTo('market');
}

/* ── CURRENT TIME ── */
function updateTime(){
  const now=new Date();
  let h=now.getHours(),m=now.getMinutes();
  const ampm=h>=12?'PM':'AM';
  h=h%12||12;
  document.getElementById('sb-time').textContent=`${h}:${m.toString().padStart(2,'0')} ${ampm}`;
}
updateTime();setInterval(updateTime,30000);

/* ── DATE ── */
function todayStr(){
  return new Date().toLocaleDateString('en-NG',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}

/* ── BAR HTML ── */
function barHtml(p,color,h=8){
  return `<div class="bar-track" style="height:${h}px"><div class="bar-fill" style="width:${Math.min(p,100)}%;height:${h}px;background:linear-gradient(90deg,${color},${color}cc);box-shadow:0 0 8px ${color}66;"></div></div>`;
}

/* ── BADGE HTML ── */
function badgeHtml(text,color){
  return `<span class="badge" style="background:${color}22;color:${color};border:1px solid ${color}44">${esc(text)}</span>`;
}

/* ── DOT HTML ── */
function dotHtml(color){
  return `<span class="dot-wrap"><span class="dot-ring" style="background:${color};opacity:.4"></span><span class="dot-core" style="background:${color}"></span></span>`;
}

let animalFilter="All", animalSearch="";
function renderAnimals(){
  const filtered=DB.animals.filter(a=>(animalFilter==="All"||a.sp===animalFilter||a.status===animalFilter)&&
    (a.id.toLowerCase().includes(animalSearch.toLowerCase())||a.breed.toLowerCase().includes(animalSearch.toLowerCase())||a.status.toLowerCase().includes(animalSearch.toLowerCase())));

  const chips=["All","Goat","Cattle","Healthy","Sick","Pregnant","Lactating"].map(f=>
    `<div class="chip ${animalFilter===f?'active':''}" onclick="setAnimalFilter('${f}')">${f}</div>`).join('');

  const cards=filtered.map(a=>`
    <div class="animal-card" onclick="showAnimalDetail('${a.id}')">
      <div class="animal-avatar" style="background:${sCol(a.status)}22">${a.sp==="Goat"?"🐐":"🐄"}</div>
      <div style="flex:1;min-width:0">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:3px">
          <span class="animal-id">${esc(a.id)}</span>
          ${badgeHtml(a.status,sCol(a.status))}
        </div>
        <div class="animal-breed">${esc(a.breed)} · ${a.sex==="F"?"♀ Female":"♂ Male"} · ${a.wt}kg</div>
        <div class="animal-loc">📍 ${esc(a.pen)}</div>
      </div>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3A4A54" stroke-width="2" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
    </div>`).join('') || '<div class="empty"><div class="empty-icon">🔍</div><div class="empty-text">No animals match your filter</div></div>';

  return `
  <div class="fu">
    <div class="sh">
      <div><h2>Animal Register</h2><p>${DB.animals.length} animals on record</p></div>
      <button class="sh-add" onclick="showAddAnimal()">➕ Add Animal</button>
    </div>
    <div class="field"><input type="text" placeholder="🔍 Search by tag, breed, status…" value="${esc(animalSearch)}" oninput="animalSearch=this.value;rerenderAnimals()"/></div>
    <div class="chips">${chips}</div>
    <div style="display:flex;gap:8px;margin-bottom:14px">
      ${[["🐐 Goats",DB.animals.filter(a=>a.sp==="Goat").length,"#2ECC71"],
         ["🐄 Cattle",DB.animals.filter(a=>a.sp==="Cattle").length,"#5DADE2"],
         ["🏥 Sick",DB.animals.filter(a=>a.status==="Sick").length,"#E74C3C"],
         ["🤰 Pregnant",DB.animals.filter(a=>a.status==="Pregnant").length,"#D4AF37"]].map(([l,v,c])=>`
        <div style="flex:1;background:${c}18;border:1px solid ${c}33;border-radius:12px;padding:8px 4px;text-align:center">
          <div style="font-family:var(--h1);font-size:20px;font-weight:700;color:${c}">${v}</div>
          <div style="font-size:9px;color:${c};font-weight:600">${l}</div>
        </div>`).join('')}
    </div>

  </div>`;
}
function setAnimalFilter(f){animalFilter=f;rerenderAnimals();}
function rerenderAnimals(){document.getElementById('content').innerHTML=renderAnimals();}

function showAnimalDetail(id){
  const a=DB.animals.find(x=>x.id===id);
  if(!a)return;
  const rows=[["Species",a.sp],["Breed",a.breed],["Sex",a.sex==="F"?"Female":"Male"],["Date of Birth",a.dob||"—"],
              ["Live Weight",`${a.wt} kg`],["Pen / Location",a.pen],["Notes",a.notes||"—"]];
  openSheet("Animal — "+a.id,`
    <div style="display:flex;align-items:center;gap:14px;background:var(--card);border-radius:16px;padding:14px;margin-bottom:18px">
      <div style="width:56px;height:56px;border-radius:16px;background:${sCol(a.status)}22;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0">${a.sp==="Goat"?"🐐":"🐄"}</div>

function showAddAnimal(){
  openSheet("Register New Animal",`

function saveAnimal(){
  const id=document.getElementById('f-id').value.trim();
  const breed=document.getElementById('f-breed').value.trim();
  if(!id||!breed)return;
  DB.animals.push({id,sp:document.getElementById('f-sp').value,breed,sex:document.getElementById('f-sex').value==="Female"?"F":"M",dob:document.getElementById('f-dob').value,wt:+document.getElementById('f-wt').value||0,status:document.getElementById('f-status').value,pen:document.getElementById('f-pen').value,notes:document.getElementById('f-notes').value});
  save(); closeSheet(); renderScreen();
}

  const expense=DB.txns.filter(t=>t.type==="Expense").reduce((s,t)=>s+t.amt,0);
  const profit=income-expense;

  const revCats=[
    {l:"Live Animal Sales",v:DB.txns.filter(t=>t.type==="Sale"&&(t.cat.includes("Goat")||t.cat.includes("Cattle"))).reduce((s,t)=>s+t.amt,0),c:"#2ECC71"},

      <div style="display:flex;gap:0">
        ${[["Revenue",income,"#2ECC71"],["Expenses",expense,"#E74C3C"],["ROI",`${income>0?pct(profit,expense):0}%`,"#D4AF37"]].map(([l,v,c],i)=>`
          <div style="flex:1;${i<2?"border-right:1px solid var(--div);padding-right:16px;":""}${i>0?"padding-left:16px":""}">
            <div style="font-size:11px;color:var(--fog)">${l}</div>
            <div style="font-family:var(--h1);font-size:17px;font-weight:700;color:${c};margin-top:3px">${typeof v==="number"?fmt(v):v}</div>
          </div>`).join('')}
      </div>
    </div>
    <div class="card" style="margin-bottom:16px">
      <div style="font-size:11px;color:var(--fog);font-weight:700;letter-spacing:.8px;text-transform:uppercase;margin-bottom:14px">Revenue Breakdown</div>
      ${revCats.map(r=>`<div style="margin-bottom:12px">
        <div style="display:flex;justify-content:space-between;margin-bottom:5px">
          <span style="font-size:12px;color:var(--mist)">${r.l}</span>
          <span style="font-size:12px;font-weight:700;color:${r.c}">${fmt(r.v)}</span>
        </div>
        ${barHtml(income>0?pct(r.v,income):0,r.c,6)}
      </div>`).join('')}
    </div>
    <div style="display:flex;gap:0;background:var(--card);border-radius:14px;padding:4px;margin-bottom:14px;border:1px solid var(--div)">
      ${[["all","All"],["sales","Sales"],["expenses","Expenses"]].map(([k,l])=>`
        <button onclick="financTab='${k}';renderScreen()" style="flex:1;padding:8px;border-radius:11px;border:none;background:${financTab===k?"#2ECC7122":"transparent"};color:${financTab===k?"#2ECC71":"var(--fog)"};font-weight:700;font-size:13px;cursor:pointer;font-family:var(--body);transition:all .2s">${l}</button>`).join('')}
    </div>
    ${list.map(t=>`<div class="tx-item">
      <div class="tx-icon" style="background:${txCol(t.type)}22">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="${txCol(t.type)}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          ${t.type==="Sale"?'<line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/>'
                           :'<line x1="12" y1="5" x2="12" y2="19"/><polyline points="19 12 12 19 5 12"/>'}
        </svg>
      </div>
      <div style="flex:1;min-width:0">
        <div class="tx-cat">${esc(t.cat)}</div>
        <div class="tx-meta">${esc(t.party)}</div>
        <div class="tx-sub">${esc(t.qty)} · ${t.date}</div>

      <div class="tx-amt" style="color:${txCol(t.type)}">${t.type==="Sale"?"+":"−"}${fmt(t.amt)}</div>

  </div>`;

  openSheet("Record Transaction",`

  DB.txns.unshift({id:Date.now(),date:new Date().toISOString().split("T")[0],type:document.getElementById('tx-type').value,cat:document.getElementById('tx-cat').value,amt,qty:document.getElementById('tx-qty').value,party:document.getElementById('tx-party').value,notes:""});
  save(); closeSheet(); renderScreen();
}

/* ══════════ SCREEN ROUTER ══════════ */
const RENDERERS = {
  home:renderHome, animals:renderAnimals, health:renderHealth,
  feeding:renderFeeding, finance:renderFinance, market:renderMarket,
  vaccines:renderVaccines, tasks:renderTasks, staff:renderStaff,
  reports:renderReports, settings:renderSettings
};
function renderScreen(){
  const fn=RENDERERS[currentScreen]||renderHome;
  document.getElementById('content').innerHTML=fn();
  updateNav();
}

/* ══════════ INTERACTIONS ══════════ */
function toggleTask(id){
  DB.tasks=DB.tasks.map(t=>t.id===id?{...t,done:!t.done}:t);
  save(); renderScreen();
}
function toggleFeed(id){
  DB.feeding=DB.feeding.map(f=>f.id===id?{...f,done:!f.done}:f);
  save(); renderScreen();
}

/* ══════════ BOTTOM SHEET ══════════ */
function openSheet(title, body){
  closeSheet();
  const el=document.createElement('div');
  el.className='sheet-overlay'; el.id='sheet-overlay';
  el.innerHTML=`<div class="sheet" id="bottom-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <div class="sheet-title">${esc(title)}</div>
      <button class="sheet-close" onclick="closeSheet()">✕</button>
    </div>
    ${body}
  </div>`;
  el.addEventListener('click',function(e){if(e.target===el)closeSheet();});
  document.body.appendChild(el);
}
function closeSheet(){
  const el=document.getElementById('sheet-overlay');
  if(el) el.remove();
}

/* ══════════ PWA INSTALL ══════════ */
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',(e)=>{
  e.preventDefault(); deferredPrompt=e;
  document.getElementById('install-banner').classList.remove('hidden');
});
document.getElementById('install-btn').addEventListener('click',async()=>{
  if(!deferredPrompt) return;
  deferredPrompt.prompt();
  const {outcome}=await deferredPrompt.userChoice;
  deferredPrompt=null;
  document.getElementById('install-banner').classList.add('hidden');
});
document.getElementById('install-close').addEventListener('click',()=>{
  document.getElementById('install-banner').classList.add('hidden');
});
window.addEventListener('appinstalled',()=>{
  document.getElementById('install-banner').classList.add('hidden');
});

/* ══════════ OFFLINE ══════════ */
function showOfflineToast(){
  const t=document.getElementById('offline-toast');
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}
window.addEventListener('offline',showOfflineToast);
window.addEventListener('online',()=>{
  const t=document.getElementById('offline-toast');
  t.textContent='✅ Back online — synced'; t.style.background='#2ECC71';
  t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2500);
});

/* ══════════ SPLASH ══════════ */
window.addEventListener('load',()=>{
  setTimeout(()=>{
    document.getElementById('splash').classList.add('gone');
    setTimeout(()=>{const s=document.getElementById('splash');if(s)s.remove();},600);
  },2200);
  renderScreen();
});
</script>

      .catch(err => console.log('[AMIRLA] SW failed:', err));

}
